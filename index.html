<!doctype html>
<html lang="en" data-accent="graphite">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Workbench: daily word games, puzzles and a blackjack table, with progress saved in your browser." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Workbench</title>
    <script>
      // Apply a stored explicit theme before first paint. "system" stamps nothing.
      (function () {
        try {
          var raw = localStorage.getItem('wb:theme')
          var theme = raw && JSON.parse(raw).data
          if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,500;1,400;1,500&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
